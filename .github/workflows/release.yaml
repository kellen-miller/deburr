name: Release

# A tag or published release never exists without verified binaries. The
# shared release action only computes the version (dry-run mode); five targets
# are built and smoke-tested; one job writes SHA256SUMS and runs the install
# script against the local archives. Publishing then goes through a draft
# release (GitHub creates the tag only when the draft is published): create the
# draft, upload every asset, download them back and verify the checksums, and
# only then publish. A failure before publishing deletes the draft; a failed
# install from the real download URL after publishing turns the release back
# into a draft. A manual dry run performs the assembly and verification but
# creates nothing.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and smoke-test all targets without publishing a release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Next version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: next
        uses: kellen-miller/ci/.github/actions/release@4f4e514ee184fbd03b393a6d0e4bccb5eea63a9a # main
        with:
          dry-run: 'true'
          token: ${{ github.token }}
      - id: plan
        env:
          NEXT_VERSION: ${{ steps.next.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ inputs.dry-run }}
        shell: bash
        run: |
          set -euo pipefail
          build=false
          publish=false
          version="$NEXT_VERSION"

          if [[ -n "$version" ]]; then
            build=true
            if [[ "$EVENT_NAME" == push || "$DRY_RUN_INPUT" == false ]]; then
              publish=true
            fi
          elif [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            # A dry run still proves that every target builds.
            build=true
            version=0.0.0-dry-run
          fi

          {
            printf 'build=%s\n' "$build"
            printf 'publish=%s\n' "$publish"
            printf 'version=%s\n' "$version"
          } >> "$GITHUB_OUTPUT"
          printf 'build=%s publish=%s version=%s\n' "$build" "$publish" "$version"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    if: ${{ needs.version.outputs.build == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            binary: deburr
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            binary: deburr
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            binary: deburr
          - target: aarch64-apple-darwin
            runner: macos-latest
            binary: deburr
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            binary: deburr.exe
    env:
      DEBURR_VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
      BINARY: ${{ matrix.binary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          target: ${{ matrix.target }}
          cache: false
          rustflags: ''

      - name: Build
        shell: bash
        run: cargo build --release --locked --target "$TARGET"

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          binary="target/$TARGET/release/$BINARY"
          test "$("$binary" --version)" = "deburr $DEBURR_VERSION"
          # The repository root holds deliberately malformed corpus files, so
          # audit the clean duplication corpus instead.
          "$binary" audit tests/corpus/dup --format json --quiet --output "$RUNNER_TEMP/smoke-report.json"
          grep -q '"schema_version": "3"' "$RUNNER_TEMP/smoke-report.json"
          grep -q '"status": "measured"' "$RUNNER_TEMP/smoke-report.json"

      - name: Package (tar.gz)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          tar -czf "dist/deburr-$TARGET.tar.gz" -C "target/$TARGET/release" "$BINARY"

      - name: Package (zip)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -Path "target/$env:TARGET/release/$env:BINARY" -DestinationPath "dist/deburr-$env:TARGET.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deburr-${{ matrix.target }}
          path: dist/deburr-*
          if-no-files-found: error

  release:
    name: Assemble and publish release
    needs:
      - version
      - build
    if: ${{ needs.version.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EXPECTED_VERSION: ${{ needs.version.outputs.version }}
      PUBLISH: ${{ needs.version.outputs.publish }}
      RELEASE_TAG: v${{ needs.version.outputs.version }}
      REPOSITORY: ${{ github.repository }}
      RELEASE_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: deburr-*
          path: dist
          merge-multiple: true

      # Runs in dry-run mode too, so the assembly is proven without publishing.
      - name: Write checksums
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          test "$(ls | wc -l)" -eq 5
          sha256sum deburr-* > SHA256SUMS
          cat SHA256SUMS

      - name: Check the install script against these archives
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install-deburr.sh "$EXPECTED_VERSION" x86_64-unknown-linux-gnu "$PWD/dist" "$RUNNER_TEMP/install-check"
          test "$("$RUNNER_TEMP/install-check/deburr" --version)" = "deburr $EXPECTED_VERSION"

      # Nothing below is public until the final publish step: a draft release
      # has no tag (GitHub creates it when the draft is published) and is not
      # visible to anyone without write access.
      - name: Refuse to overwrite an existing release or tag
        if: ${{ env.PUBLISH == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            printf 'tag %s already exists; delete it (and any release for it) before re-running\n' "$RELEASE_TAG" >&2
            exit 1
          fi

          # A leftover draft from an interrupted run is safe to discard.
          gh release list --repo "$REPOSITORY" --limit 200 --json tagName,isDraft \
            --jq ".[] | select(.tagName == \"$RELEASE_TAG\") | .isDraft" > "$RUNNER_TEMP/existing-release.txt"
          if grep -qx false "$RUNNER_TEMP/existing-release.txt"; then
            printf 'a published release for %s already exists\n' "$RELEASE_TAG" >&2
            exit 1
          fi

          if grep -qx true "$RUNNER_TEMP/existing-release.txt"; then
            printf 'deleting a leftover draft for %s\n' "$RELEASE_TAG"
            gh release delete "$RELEASE_TAG" --repo "$REPOSITORY" --yes
          fi

      - name: Create draft release
        id: draft
        if: ${{ env.PUBLISH == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --repo "$REPOSITORY" \
            --draft --target "$RELEASE_SHA" --title "$RELEASE_TAG" --generate-notes

      - name: Upload assets to the draft
        id: upload
        if: ${{ env.PUBLISH == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/* --repo "$REPOSITORY"

      - name: Verify the draft's assets
        id: verify
        if: ${{ env.PUBLISH == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/draft-assets"
          gh release download "$RELEASE_TAG" --repo "$REPOSITORY" --dir "$RUNNER_TEMP/draft-assets"

          # The draft must hold exactly the files that were checksummed, unchanged.
          diff <(cd dist && ls) <(cd "$RUNNER_TEMP/draft-assets" && ls)
          (cd "$RUNNER_TEMP/draft-assets" && sha256sum --check --strict SHA256SUMS)
          for name in dist/*; do
            cmp "$name" "$RUNNER_TEMP/draft-assets/${name##*/}"
          done

          bash scripts/install-deburr.sh "$EXPECTED_VERSION" x86_64-unknown-linux-gnu \
            "$RUNNER_TEMP/draft-assets" "$RUNNER_TEMP/draft-install"
          test "$("$RUNNER_TEMP/draft-install/deburr" --version)" = "deburr $EXPECTED_VERSION"

      - name: Publish the release
        id: publish
        if: ${{ env.PUBLISH == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --repo "$REPOSITORY" --draft=false

      # Any failure or cancellation before the publish step leaves nothing
      # public: remove the draft so a re-run starts clean. The draft has no
      # tag, so there is no tag to delete.
      - name: Delete the draft after a failure
        if: ${{ (failure() || cancelled()) && steps.draft.outcome != 'skipped' && steps.publish.outcome != 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          # If the publish call itself failed, the release may or may not be
          # public; only a release that is still a draft is deleted.
          gh release list --repo "$REPOSITORY" --limit 200 --json tagName,isDraft \
            --jq ".[] | select(.tagName == \"$RELEASE_TAG\") | .isDraft" > "$RUNNER_TEMP/final-state.txt"
          if grep -qx true "$RUNNER_TEMP/final-state.txt"; then
            printf 'release %s was not published; deleting the draft\n' "$RELEASE_TAG"
            gh release delete "$RELEASE_TAG" --repo "$REPOSITORY" --yes
          elif grep -qx false "$RUNNER_TEMP/final-state.txt"; then
            printf '::error::release %s is already public although the job failed; check it by hand\n' "$RELEASE_TAG"
          fi

      # The assets are now public. Prove the real download path works; if it
      # does not, take the release down again.
      - name: Install from the published release
        id: published-install
        if: ${{ env.PUBLISH == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/$REPOSITORY/releases/download/$RELEASE_TAG"
          ok=false
          # The download CDN can lag the publish by a few seconds.
          for attempt in 1 2 3 4 5; do
            if bash scripts/install-deburr.sh "$EXPECTED_VERSION" x86_64-unknown-linux-gnu \
              "$url" "$RUNNER_TEMP/published-install" \
              && test "$("$RUNNER_TEMP/published-install/deburr" --version)" = "deburr $EXPECTED_VERSION"; then
              ok=true
              break
            fi
            printf 'install attempt %s failed; retrying\n' "$attempt" >&2
            sleep 10
          done

          if [[ "$ok" != true ]]; then
            printf '::error::release %s failed the post-publish install check; re-drafting it\n' "$RELEASE_TAG"
            gh release edit "$RELEASE_TAG" --repo "$REPOSITORY" --draft=true
            printf '::error::%s is back to a draft. The tag %s still points at %s: delete the draft and the tag, then re-run this workflow.\n' \
              "$RELEASE_TAG" "$RELEASE_TAG" "$RELEASE_SHA"
            exit 1
          fi
