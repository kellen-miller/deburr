name: Deburr

on:
  pull_request:

concurrency:
  group: Test-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deburr-paths:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.paths.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: paths
        uses: kellen-miller/ci/.github/actions/changed-paths@2af77688327c2fc0f164e91f77e8784ef25e14c6
        with:
          filters: |
            {
              "action": [
                ".github/workflows/**",
                ".github/actions/**",
                "Cargo.toml",
                "Cargo.lock",
                "rust-toolchain.toml",
                "src/**",
                "templates/**",
                "third_party/**",
                "docs/cleanup.md",
                "tests/corpus/**",
                "scripts/**",
                "action.yml"
              ],
              "typescript": [
                ".github/workflows/**",
                "Cargo.toml",
                "Cargo.lock",
                "rust-toolchain.toml",
                "src/**",
                "tests/vscode.rs",
                "third_party/tree-sitter-typescript/**"
              ]
            }

  install-script-tests:
    name: Install script (${{ matrix.os }})
    needs: deburr-paths
    if: ${{ !cancelled() && (needs.deburr-paths.result != 'success' || fromJSON(needs.deburr-paths.outputs.changes).action) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
          rustflags: ''

      # Builds this checkout, packages it like the release workflow, and checks
      # that scripts/install-deburr.sh installs it with a good checksum and
      # refuses a corrupted checksum, a wrong version, and a plain-HTTP source.
      - name: Test install script
        shell: bash
        run: bash scripts/test-install-deburr.sh

  action-smoke-tests:
    name: GitHub Actions / Action tests (${{ matrix.os }})
    needs: deburr-paths
    if: ${{ !cancelled() && (needs.deburr-paths.result != 'success' || fromJSON(needs.deburr-paths.outputs.changes).action) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The repository root holds deliberately malformed corpus files, so the
      # Action audits the clean duplication corpus. `uses: ./` is not a
      # release tag, so the Action builds Deburr with cargo build --release.
      - name: Audit with built-in duplication
        id: measured
        uses: ./
        with:
          path: tests/corpus/dup
          format: json

      - name: Verify measured duplication
        env:
          REPORT: ${{ steps.measured.outputs.report }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$REPORT"
          grep -q '"status": "measured"' "$REPORT"
          grep -q '"family_id"' "$REPORT"

      - name: Audit with duplication disabled
        id: skipped
        uses: ./
        with:
          path: tests/corpus/dup
          format: json
          duplicates: false

      - name: Verify duplication was skipped
        env:
          REPORT: ${{ steps.skipped.outputs.report }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$REPORT"
          grep -q '"status": "not_requested"' "$REPORT"

      - name: Audit with a strict clone size
        id: strict
        uses: ./
        with:
          path: tests/corpus/dup
          format: json
          min-clone-tokens: 100000

      - name: Verify the clone size applies
        env:
          REPORT: ${{ steps.strict.outputs.report }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$REPORT"
          grep -q '"status": "measured"' "$REPORT"
          ! grep -q '"family_id"' "$REPORT"

      - name: Reject an invalid clone size
        id: rejected
        continue-on-error: true
        uses: ./
        with:
          path: tests/corpus/dup
          format: json
          min-clone-lines: 0

      - name: Verify the invalid clone size was rejected
        env:
          OUTCOME: ${{ steps.rejected.outcome }}
        shell: bash
        run: test "$OUTCOME" = failure

  action-hostile-config-tests:
    name: GitHub Actions / Hostile Cargo config (${{ matrix.os }})
    needs: deburr-paths
    if: ${{ !cancelled() && (needs.deburr-paths.result != 'success' || fromJSON(needs.deburr-paths.outputs.changes).action) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The audited workspace is untrusted. Its Cargo configuration must not
      # change how the Action builds Deburr: a bogus build.target would move or
      # break the output, a failing rustc-wrapper would run repository code,
      # and build.target-dir would put the binary elsewhere.
      - name: Plant a hostile Cargo configuration in the workspace
        shell: bash
        run: |
          set -euo pipefail
          printf '#!/bin/sh\necho "hostile rustc-wrapper ran" >&2\nexit 1\n' > hostile-wrapper.sh
          chmod +x hostile-wrapper.sh
          mkdir -p .cargo
          {
            printf '[build]\n'
            printf "target = 'bogus-unknown-nothing'\n"
            printf "rustc-wrapper = '%s/hostile-wrapper.sh'\n" "$GITHUB_WORKSPACE"
            printf "target-dir = 'hostile-target'\n"
          } > .cargo/config.toml
          cat .cargo/config.toml

      - name: Audit with the hostile configuration present
        id: audit
        uses: ./
        env:
          RUSTC_WRAPPER: ${{ github.workspace }}/hostile-wrapper.sh
          CARGO_BUILD_TARGET: bogus-unknown-nothing
          CARGO_TARGET_DIR: ${{ github.workspace }}/hostile-target
        with:
          path: tests/corpus/dup
          format: json

      - name: Verify the audit succeeded and the workspace was not used
        env:
          REPORT: ${{ steps.audit.outputs.report }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$REPORT"
          grep -q '"status": "measured"' "$REPORT"
          for leftover in hostile-target target; do
            if test -e "$leftover"; then
              printf '%s was created in the workspace\n' "$leftover" >&2
              exit 1
            fi
          done

  typescript-integration-tests:
    name: TypeScript integration tests (VS Code)
    needs: deburr-paths
    if: ${{ !cancelled() && (needs.deburr-paths.result != 'success' || fromJSON(needs.deburr-paths.outputs.changes).typescript) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
          rustflags: ''

      - name: Check out pinned VS Code sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: microsoft/vscode
          ref: bd64649be19f2da0f09c2ab84c066c6c764b83be
          path: .integration/vscode
          sparse-checkout: src

      - name: Audit real TypeScript
        env:
          DEBURR_VSCODE_SRC: ${{ github.workspace }}/.integration/vscode/src
        run: cargo test --release --locked --test vscode -- --nocapture
