name: Test

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/deburr

  action-smoke:
    name: GitHub Action smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Audit this checkout
        id: deburr
        uses: ./
        with:
          path: .
          format: json
          duplicates: false

      - name: Verify report
        env:
          REPORT: ${{ steps.deburr.outputs.report }}
        shell: bash
        run: test -s "$REPORT"

  action-duplication-smoke:
    name: GitHub Action duplication smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Provision CPD test executable
        shell: bash
        run: |
          set -euo pipefail
          cpd_dir="$RUNNER_TEMP/cpd major 5"
          mkdir -p "$cpd_dir"
          cat > "$cpd_dir/cpd" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          if [[ "${1:-}" == "--version" ]]; then
            printf 'CPD %s\n' "${CPD_VERSION:-5.42.7}"
            exit 0
          fi

          output=""
          while (($#)); do
            case "$1" in
              --output)
                output="$2"
                shift 2
                ;;
              *)
                shift
                ;;
            esac
          done

          if [[ -z "$output" ]]; then
            printf 'missing --output\n' >&2
            exit 2
          fi

          mkdir -p "$output"
          printf '{"duplicates":[],"statistics":{"total":{"percentage":0,"sources":1}}}\n' > "$output/report.json"
          EOF
          chmod +x "$cpd_dir/cpd"

      - name: Audit with caller CPD path containing spaces
        id: enabled
        uses: ./
        with:
          path: .
          format: json
          duplicates: true
          cpd: ${{ runner.temp }}/cpd major 5/cpd

      - name: Verify enabled duplication report
        env:
          REPORT: ${{ steps.enabled.outputs.report }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$REPORT"
          grep -q '"status": "measured"' "$REPORT"

      - name: Reject CPD path unless duplication is enabled
        id: rejected
        continue-on-error: true
        uses: ./
        with:
          path: .
          format: json
          cpd: ${{ runner.temp }}/cpd major 5/cpd

      - name: Verify disabled duplication rejection
        env:
          OUTCOME: ${{ steps.rejected.outcome }}
        shell: bash
        run: test "$OUTCOME" = failure

      - name: Audit with unsupported CPD version
        id: unsupported
        continue-on-error: true
        env:
          CPD_VERSION: 4.0.0
        uses: ./
        with:
          path: .
          format: json
          duplicates: true
          cpd: ${{ runner.temp }}/cpd major 5/cpd

      - name: Verify unsupported version preserves report
        env:
          OUTCOME: ${{ steps.unsupported.outcome }}
          REPORT: ${{ steps.unsupported.outputs.report }}
        shell: bash
        run: |
          set -euo pipefail
          test "$OUTCOME" = failure
          test -s "$REPORT"
          grep -q 'unsupported' "$REPORT"

  duplication-real:
    name: CPD/jscpd major 5 integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node for detector installation
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install latest detector releases in major 5
        run: npm install -g cpd@5 jscpd@5

      - name: Test real detectors and native parsing without CGO
        env:
          CGO_ENABLED: 0
        run: go test -v ./internal/analysis

      - name: Audit with caller jscpd
        id: jscpd
        uses: ./
        with:
          path: .
          format: json
          duplicates: true
          jscpd: jscpd

      - name: Verify measured duplication
        env:
          REPORT: ${{ steps.jscpd.outputs.report }}
        shell: bash
        run: |
          test -s "$REPORT"
          grep -q '"status": "measured"' "$REPORT"

      - name: Provision configured duplication fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/deburr config"
          mkdir -p "$fixture/src"
          cat > "$fixture/src/one.ts" <<'SOURCE'
          export function value(n: number) {
            if (n > 1) {
              console.log(n);
            }
            return n * 2;
          }
          SOURCE
          cp "$fixture/src/one.ts" "$fixture/src/two.ts"
          cp "$fixture/src/one.ts" "$fixture/src/ignored.ts"
          printf '%s\n' '{"path":["src"],"ignore":["**/ignored.ts"],"minTokens":10,"minLines":1,"threshold":0}' > "$fixture/selected.json"

      - name: Audit configured duplication with advisory threshold
        id: configured
        uses: ./
        with:
          path: ${{ runner.temp }}/deburr config
          format: json
          duplicates: true
          jscpd: jscpd
          duplicates-config: ${{ runner.temp }}/deburr config/selected.json

      - name: Audit configured duplication with enforced threshold
        id: enforced
        continue-on-error: true
        uses: ./
        with:
          path: ${{ runner.temp }}/deburr config
          format: json
          duplicates: true
          jscpd: jscpd
          duplicates-config: ${{ runner.temp }}/deburr config/selected.json
          enforce-duplicates-threshold: true

      - name: Verify configuration and preserved threshold evidence
        env:
          ADVISORY_REPORT: ${{ steps.configured.outputs.report }}
          ENFORCED_REPORT: ${{ steps.enforced.outputs.report }}
          ENFORCED_OUTCOME: ${{ steps.enforced.outcome }}
        shell: bash
        run: |
          test "$ENFORCED_OUTCOME" = failure
          python3 - <<'PY'
          import json
          import os
          for name in ("ADVISORY_REPORT", "ENFORCED_REPORT"):
              with open(os.environ[name]) as handle:
                  report = json.load(handle)
              duplication = report["duplication"]
              assert report["coverage"]["analyzed"] == 3
              assert duplication["status"] == "measured"
              assert duplication["threshold_exceeded"]
              assert duplication["clones"]
              assert duplication["percentages"][0]["files"] == 2
              assert duplication["config"]["enforce_threshold"] == (name == "ENFORCED_REPORT")
          PY

  typescript-integration:
    name: VS Code TypeScript integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Check out pinned VS Code sources
        uses: actions/checkout@v4
        with:
          repository: microsoft/vscode
          ref: bd64649be19f2da0f09c2ab84c066c6c764b83be
          path: .integration/vscode
          sparse-checkout: src

      - name: Audit real TypeScript without CGO
        env:
          CGO_ENABLED: 0
          DEBURR_VSCODE_SRC: ${{ github.workspace }}/.integration/vscode/src
        run: go test -v ./internal/analysis -run '^TestVSCodeTypeScriptIntegration$' -count=1 -timeout=15m
