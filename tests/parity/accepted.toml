# VS Code `src` (bd64649), a parity root for the full TypeScript projection.
# Rust measures the same 270,201 functions as the Go baseline and the same 54
# findings. The only differences are the 34 below, in two classes, both caused
# by the Go version's pure-Go tree builder (gotreesitter), which the official
# grammar does not share:
#
#   - `async *name()` and `static *name()` generator methods: gotreesitter
#     gives the `name` field to the modifier, so Go names the function
#     `Class.async` or `Class.static` and Rust names it `Class.name`. Each such
#     method is one Go-only entry and one Rust-only entry.
#   - a method followed by a trailing `// comment` on its closing line:
#     gotreesitter extends the method's range over the comment, so Go's end
#     column is past the comment; Rust ends it at the closing brace.

