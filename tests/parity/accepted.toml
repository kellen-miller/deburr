# Divergences between the Go and Rust reports that are allowed to remain.
#
# Each entry names exactly one section, one entry key (path plus occurrence
# index, for example "web/app.ts#1"), and one field, with the reason it is
# allowed. Never accept a whole category of difference. Permitted reasons:
#
#   - invalid literal lexing that go/parser rejects and tree-sitter accepts
#   - TypeScript parse-error files' code-line counts (the Go version reports
#     zero; Rust counts every file it read)
#   - duplicate-branch findings that differ only because the Go version
#     compared printed layout or because terminators now separate statements
#
# Every entry must also be recorded in the ExecPlan's Surprises & Discoveries.

