[package]
name = "deburr"
version = "1.0.0"
edition = "2024"
rust-version = "1.97"
description = "Deterministic cleanup evidence for Go and TypeScript code"
license = "MIT"
publish = false

[dependencies]
askama = "0.16"
clap = { version = "4", features = ["derive"] }
cpd-core = "=0.1.23"
hex = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tree-sitter = "0.27"
tree-sitter-go = "0.25"
tree-sitter-typescript = "0.23"

[dev-dependencies]
tempfile = "3"
toml = "0.9"

[profile.release]
lto = "thin"
