[package]
name = "deburr"
version = "1.0.0"
edition = "2024"
rust-version = "1.97"
description = "Deterministic cleanup evidence for Go and TypeScript code"
license = "MIT"
publish = false

[dependencies]
askama = "0.16"
clap = { version = "4", features = ["derive"] }
cpd-core = "=0.1.23"
hex = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
# Patched forks (deburr-patches branches); see each fork's PATCHES.md.
tree-sitter-go = { git = "https://github.com/kellen-miller/tree-sitter-go", rev = "3d7c1bb677529588955dd48857cd184550bf76ef" }
tree-sitter-typescript = { git = "https://github.com/kellen-miller/tree-sitter-typescript", rev = "9be38cb0eb82174cdde52dde788bf576a91e753b" }

[dev-dependencies]
tempfile = "3"
toml = "0.9"

[profile.release]
lto = "thin"
