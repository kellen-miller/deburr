name: Deburr
description: Run the Deburr Go and TypeScript analyzer and write a report for a path.
author: Kellen Miller

inputs:
  path:
    description: File or directory to audit, relative to the workspace unless absolute.
    required: false
    default: .
  format:
    description: "Format of the file the report output points to: text, json, markdown, html, or github. Annotations, the job summary, and the artifact are written whatever this is."
    required: false
    default: github
  duplicates:
    description: Detect clones in the audited files. Set to false to skip clone detection.
    required: false
    default: "true"
  min-clone-tokens:
    description: Minimum tokens in a clone.
    required: false
    default: "80"
  min-clone-lines:
    description: Minimum code lines in each clone region.
    required: false
    default: "8"
  summary:
    description: Write the report to the job summary. On pull requests it leads with what the pull request changed.
    required: false
    default: "true"
  upload:
    description: Upload report.json and report.html as a workflow artifact.
    required: false
    default: "true"
  artifact-name:
    description: Name of the uploaded artifact. Artifact names must be unique within a workflow run.
    required: false
    default: deburr-report
  compare-base:
    description: On pull requests, audit the base commit, compare, and annotate only what got worse.
    required: false
    default: "true"

outputs:
  report:
    description: Absolute path of the report in the requested format, when a report exists.
    value: ${{ steps.audit.outputs.report }}
  directory:
    description: Absolute path of the directory holding report.json, report.html, report.md, and report.github.
    value: ${{ steps.audit.outputs.directory }}

runs:
  using: composite
  steps:
    - name: Choose binary source
      id: source
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        # A release tag such as v1.0.0 has prebuilt, checksummed binaries.
        # Any other ref (branch, commit, local `uses: ./`) is built from source.
        if [[ "$ACTION_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          printf 'mode=release\n' >> "$GITHUB_OUTPUT"
        else
          printf 'mode=source\n' >> "$GITHUB_OUTPUT"
        fi

    - name: Download Deburr release
      id: release
      if: ${{ steps.source.outputs.mode == 'release' }}
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) target=x86_64-unknown-linux-gnu ;;
          Linux/ARM64) target=aarch64-unknown-linux-gnu ;;
          macOS/X64) target=x86_64-apple-darwin ;;
          macOS/ARM64) target=aarch64-apple-darwin ;;
          Windows/X64) target=x86_64-pc-windows-msvc ;;
          *)
            printf 'Deburr has no prebuilt binary for %s/%s.\n' "$RUNNER_OS" "$RUNNER_ARCH" >&2
            exit 2
            ;;
        esac

        dest="$RUNNER_TEMP/deburr/bin"
        bash "$ACTION_PATH/scripts/install-deburr.sh" \
          "${ACTION_REF#v}" "$target" \
          "https://github.com/$ACTION_REPOSITORY/releases/download/$ACTION_REF" \
          "$dest"

        binary="$dest/deburr"
        if [[ "$RUNNER_OS" == Windows ]]; then
          binary="$binary.exe"
        fi
        printf 'bin=%s\n' "$binary" >> "$GITHUB_OUTPUT"

    - name: Set up Rust
      if: ${{ steps.source.outputs.mode == 'source' }}
      uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      with:
        toolchain: stable
        cache: false
        rustflags: ''

    - name: Build Deburr
      id: build
      if: ${{ steps.source.outputs.mode == 'source' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        # The caller's workspace is untrusted input. Cargo reads
        # .cargo/config.toml from the current directory and every parent, so
        # `build.target`, `build.rustc-wrapper`, and `build.target-dir` in the
        # audited repository could redirect the output or run its code. Build
        # a copy of the Action's source under RUNNER_TEMP (outside the
        # workspace and without any .cargo directory), and clear the
        # environment overrides that do the same. CARGO_HOME is replaced with
        # a fresh directory too, because Cargo reads $CARGO_HOME/config.toml
        # regardless of the working directory and a caller may point it into
        # the workspace.
        export CARGO_HOME="$RUNNER_TEMP/deburr/cargo-home"
        rm -rf "$CARGO_HOME"
        mkdir -p "$CARGO_HOME"
        unset RUSTC RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS \
          CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_RUSTC CARGO_BUILD_RUSTC_WRAPPER \
          CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER CARGO_BUILD_RUSTFLAGS \
          CARGO_BUILD_TARGET CARGO_BUILD_TARGET_DIR CARGO_TARGET_DIR

        # Cargo is a native program and takes native paths; Git Bash's tar on
        # Windows reads `D:` in a native path as a remote host, so the copy
        # uses POSIX paths there.
        source_dir="$RUNNER_TEMP/deburr/source"
        target_dir="$RUNNER_TEMP/deburr/target"
        action_tree="$ACTION_PATH"
        if command -v cygpath >/dev/null 2>&1; then
          source_dir=$(cygpath -u "$source_dir")
          action_tree=$(cygpath -u "$ACTION_PATH")
        fi

        rm -rf "$source_dir"
        mkdir -p "$source_dir"
        tar -C "$action_tree" --exclude=.git --exclude=.cargo --exclude=target -cf - . \
          | tar -C "$source_dir" -xf -

        cd "$source_dir"
        cargo build --release --locked --target-dir "$target_dir"

        binary="$target_dir/release/deburr"
        if [[ "$RUNNER_OS" == Windows ]]; then
          binary="$binary.exe"
        fi
        printf 'bin=%s\n' "$binary" >> "$GITHUB_OUTPUT"

    - name: Audit
      id: audit
      shell: bash
      env:
        DEBURR_BIN: ${{ steps.release.outputs.bin || steps.build.outputs.bin }}
        DEBURR_PATH: ${{ inputs.path }}
        DEBURR_FORMAT: ${{ inputs.format }}
        DEBURR_DUPLICATES: ${{ inputs.duplicates }}
        DEBURR_MIN_CLONE_TOKENS: ${{ inputs.min-clone-tokens }}
        DEBURR_MIN_CLONE_LINES: ${{ inputs.min-clone-lines }}
        DEBURR_SUMMARY: ${{ inputs.summary }}
        DEBURR_UPLOAD: ${{ inputs.upload }}
        DEBURR_COMPARE_BASE: ${{ inputs.compare-base }}
        DEBURR_EVENT: ${{ github.event_name }}
        DEBURR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail

        case "$DEBURR_FORMAT" in
          text|json|markdown|html|github) ;;
          *)
            printf 'Unsupported Deburr report format: %s\n' "$DEBURR_FORMAT" >&2
            exit 2
            ;;
        esac

        for value in "$DEBURR_DUPLICATES" "$DEBURR_SUMMARY" "$DEBURR_UPLOAD" "$DEBURR_COMPARE_BASE"; do
          case "$value" in
            true|false) ;;
            *)
              printf 'The Deburr duplicates, summary, upload, and compare-base inputs must be true or false.\n' >&2
              exit 2
              ;;
          esac
        done

        for value in "$DEBURR_MIN_CLONE_TOKENS" "$DEBURR_MIN_CLONE_LINES"; do
          if [[ ! "$value" =~ ^[1-9][0-9]*$ ]]; then
            printf 'The Deburr min-clone-tokens and min-clone-lines inputs must be positive integers.\n' >&2
            exit 2
          fi
        done

        if [[ -z "$DEBURR_PATH" || "$DEBURR_PATH" == *$'\n'* || "$DEBURR_PATH" == *$'\r'* ]]; then
          printf 'The Deburr path must be non-empty and must not contain newlines.\n' >&2
          exit 2
        fi

        is_absolute_path() {
          case "$1" in
            /*|[A-Za-z]:[\\/]*|\\\\*) return 0 ;;
            *) return 1 ;;
          esac
        }

        target="$DEBURR_PATH"
        if ! is_absolute_path "$target"; then
          target="$GITHUB_WORKSPACE/$target"
        fi

        # `render --source` and the base audit want a directory; a file target
        # reports paths relative to its parent.
        source_dir="$target"
        if [[ -f "$target" ]]; then
          source_dir=$(dirname "$target")
        fi

        invocation_dir="$RUNNER_TEMP/deburr/${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}-${RANDOM}"
        mkdir -p "$invocation_dir"
        printf 'directory=%s\n' "$invocation_dir" >> "$GITHUB_OUTPUT"

        # One audit, to JSON. Every other file is rendered from it, so the
        # tree is analyzed once however many formats are written.
        report_json="$invocation_dir/report.json"
        settings_args=()
        if [[ "$DEBURR_DUPLICATES" == true ]]; then
          settings_args+=(--min-clone-tokens "$DEBURR_MIN_CLONE_TOKENS" --min-clone-lines "$DEBURR_MIN_CLONE_LINES")
        else
          settings_args+=(--no-duplicates)
        fi

        set +e
        "$DEBURR_BIN" audit "$target" --format json --output "$report_json" "${settings_args[@]}"
        status=$?
        set -e

        # Audit exits nonzero for analysis errors but still writes the report.
        if [[ ! -f "$report_json" ]]; then
          exit "$status"
        fi

        file_for() {
          case "$1" in
            markdown) printf '%s/report.md' "$invocation_dir" ;;
            *) printf '%s/report.%s' "$invocation_dir" "$1" ;;
          esac
        }

        formats=(html markdown github)
        case "$DEBURR_FORMAT" in
          text) formats+=(text) ;;
        esac

        for format in "${formats[@]}"; do
          if ! "$DEBURR_BIN" render "$report_json" --source "$source_dir" \
            --format "$format" --output "$(file_for "$format")"; then
            printf 'Deburr could not render the %s report.\n' "$format" >&2
            if [[ "$status" -eq 0 ]]; then
              status=1
            fi
          fi
        done

        # On pull requests, audit the base commit the same way and compare, so
        # annotations and the summary lead with what this pull request changed.
        # A failure anywhere here only drops the comparison, never the job.
        base_tree=""
        compare_note=""

        cleanup_base() {
          if [[ -n "$base_tree" ]]; then
            git -C "$GITHUB_WORKSPACE" worktree remove --force "$base_tree" >/dev/null 2>&1 || true
            git -C "$GITHUB_WORKSPACE" worktree prune >/dev/null 2>&1 || true
          fi
        }
        trap cleanup_base EXIT

        compare_with_base() {
          local base_json="$invocation_dir/base.json"
          local base_target

          if is_absolute_path "$DEBURR_PATH"; then
            compare_note="path is absolute"
            return 1
          fi

          if [[ ! "$DEBURR_BASE_SHA" =~ ^[0-9a-f]{40,64}$ ]]; then
            compare_note="the base commit is unknown"
            return 1
          fi

          if ! git -C "$GITHUB_WORKSPACE" cat-file -e "$DEBURR_BASE_SHA^{commit}" 2>/dev/null; then
            if ! git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$DEBURR_BASE_SHA" >/dev/null 2>&1; then
              compare_note="could not fetch the base commit"
              return 1
            fi
          fi

          if ! git -C "$GITHUB_WORKSPACE" worktree add --detach "$invocation_dir/base" "$DEBURR_BASE_SHA" >/dev/null 2>&1; then
            compare_note="could not check out the base commit"
            return 1
          fi
          base_tree="$invocation_dir/base"

          base_target="$base_tree/$DEBURR_PATH"
          if [[ ! -e "$base_target" ]]; then
            compare_note="the path does not exist in the base commit"
            return 1
          fi

          # Same clone settings as the head audit, or compare reports the
          # reports as incompatible. The base audit's own exit status does not
          # matter: compare reads whether the report is complete.
          "$DEBURR_BIN" audit "$base_target" --format json --output "$base_json" --quiet "${settings_args[@]}" || true
          if [[ ! -f "$base_json" ]]; then
            compare_note="the base audit failed"
            return 1
          fi

          if ! "$DEBURR_BIN" compare "$base_json" "$report_json" --source "$source_dir" \
            --format markdown --output "$invocation_dir/comparison.md" 2>/dev/null; then
            compare_note="the base and this pull request were not comparable"
            return 1
          fi

          if ! "$DEBURR_BIN" compare "$base_json" "$report_json" --source "$source_dir" \
            --format github --output "$invocation_dir/comparison.github" 2>/dev/null; then
            compare_note="could not render the comparison"
            return 1
          fi
        }

        if [[ "$DEBURR_COMPARE_BASE" == true && ( "$DEBURR_EVENT" == pull_request || "$DEBURR_EVENT" == pull_request_target ) ]]; then
          if ! compare_with_base; then
            rm -f "$invocation_dir/comparison.md" "$invocation_dir/comparison.github"
            printf 'Pull-request comparison unavailable: %s.\n' "$compare_note" >&2
          fi
        fi

        # Workflow commands on stdout become annotations, so print exactly one
        # set. A successful comparison rewrites its paths to be
        # workspace-relative, so it replaces the audit's annotations.
        annotations="$(file_for github)"
        if [[ -f "$invocation_dir/comparison.github" ]]; then
          annotations="$invocation_dir/comparison.github"
        fi
        cat "$annotations"

        if [[ "$DEBURR_SUMMARY" == true && -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
          {
            if [[ -f "$invocation_dir/comparison.md" ]]; then
              cat "$invocation_dir/comparison.md"
              printf '\n'
            elif [[ -n "$compare_note" ]]; then
              printf 'Pull-request comparison unavailable: %s.\n\n' "$compare_note"
            fi
            cat "$(file_for markdown)"
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        output="$(file_for "$DEBURR_FORMAT")"
        if [[ -f "$output" ]]; then
          printf 'report=%s\n' "$output" >> "$GITHUB_OUTPUT"
        fi

        exit "$status"

    - name: Upload report
      if: ${{ !cancelled() && inputs.upload == 'true' && steps.audit.outputs.directory != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ steps.audit.outputs.directory }}/report.json
          ${{ steps.audit.outputs.directory }}/report.html
        if-no-files-found: ignore
