name: Deburr
description: Run the Deburr Go analyzer and write a report for a path.
author: Kellen Miller

inputs:
  path:
    description: File or directory to audit, relative to the workspace unless absolute.
    required: false
    default: .
  format:
    description: "Report format: text, json, html, or github."
    required: false
    default: github
  duplicates:
    description: Run the opt-in CPD 5.3.0 duplication adapter.
    required: false
    default: "false"
  cpd:
    description: Optional path to a caller-provided CPD 5.3.0 executable.
    required: false
    default: ""

outputs:
  report:
    description: Absolute path of the report written by the audit, when a report exists.
    value: ${{ steps.audit.outputs.report }}

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache: false

    - name: Build Deburr
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/deburr"
        rm -f "$RUNNER_TEMP/deburr/deburr"
        go build -trimpath -o "$RUNNER_TEMP/deburr/deburr" ./cmd/deburr

    - name: Audit
      id: audit
      shell: bash
      env:
        DEBURR_PATH: ${{ inputs.path }}
        DEBURR_FORMAT: ${{ inputs.format }}
        DEBURR_DUPLICATES: ${{ inputs.duplicates }}
        DEBURR_CPD: ${{ inputs.cpd }}
      run: |
        set -euo pipefail

        case "$DEBURR_FORMAT" in
          text|json|html|github) ;;
          *)
            printf 'Unsupported Deburr report format: %s\n' "$DEBURR_FORMAT" >&2
            exit 2
            ;;
        esac

        case "$DEBURR_DUPLICATES" in
          true|false) ;;
          *)
            printf 'The Deburr duplicates input must be true or false.\n' >&2
            exit 2
            ;;
        esac

        if [[ -n "$DEBURR_CPD" && "$DEBURR_DUPLICATES" != true ]]; then
          printf 'The Deburr cpd input requires duplicates: true.\n' >&2
          exit 2
        fi

        if [[ "$DEBURR_CPD" == *$'\n'* || "$DEBURR_CPD" == *$'\r'* ]]; then
          printf 'The Deburr cpd path must not contain newlines.\n' >&2
          exit 2
        fi

        if [[ -z "$DEBURR_PATH" || "$DEBURR_PATH" == *$'\n'* || "$DEBURR_PATH" == *$'\r'* ]]; then
          printf 'The Deburr path must be non-empty and must not contain newlines.\n' >&2
          exit 2
        fi

        is_absolute_path() {
          case "$1" in
            /*|[A-Za-z]:[\\/]*|\\\\*) return 0 ;;
            *) return 1 ;;
          esac
        }

        target="$DEBURR_PATH"
        if ! is_absolute_path "$target"; then
          target="$GITHUB_WORKSPACE/$target"
        fi

        invocation_dir="$RUNNER_TEMP/deburr/${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}-${RANDOM}"
        mkdir -p "$invocation_dir"
        output="$invocation_dir/report.$DEBURR_FORMAT"
        audit_args=(audit "$target" --format "$DEBURR_FORMAT" --output "$output")
        if [[ "$DEBURR_DUPLICATES" == true ]]; then
          if [[ -n "$DEBURR_CPD" ]]; then
            audit_args+=(--cpd "$DEBURR_CPD")
          else
            audit_args+=(--duplicates)
          fi
        fi

        set +e
        "$RUNNER_TEMP/deburr/deburr" "${audit_args[@]}"
        status=$?
        set -e

        if [[ -f "$output" ]]; then
          if [[ "$DEBURR_FORMAT" == github ]]; then
            cat "$output"
          fi
          printf 'report=%s\n' "$output" >> "$GITHUB_OUTPUT"
        fi
        exit "$status"
