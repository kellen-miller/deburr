name: Deburr
description: Run the Deburr Go and TypeScript analyzer and write a report for a path.
author: Kellen Miller

inputs:
  path:
    description: File or directory to audit, relative to the workspace unless absolute.
    required: false
    default: .
  format:
    description: "Report format: text, json, html, or github."
    required: false
    default: github
  duplicates:
    description: Detect clones in the audited files. Set to false to skip clone detection.
    required: false
    default: "true"
  min-clone-tokens:
    description: Minimum tokens in a clone.
    required: false
    default: "80"
  min-clone-lines:
    description: Minimum code lines in each clone region.
    required: false
    default: "8"

outputs:
  report:
    description: Absolute path of the report written by the audit, when a report exists.
    value: ${{ steps.audit.outputs.report }}

runs:
  using: composite
  steps:
    - name: Choose binary source
      id: source
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        # A release tag such as v1.0.0 has prebuilt, checksummed binaries.
        # Any other ref (branch, commit, local `uses: ./`) is built from source.
        if [[ "$ACTION_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          printf 'mode=release\n' >> "$GITHUB_OUTPUT"
        else
          printf 'mode=source\n' >> "$GITHUB_OUTPUT"
        fi

    - name: Download Deburr release
      id: release
      if: ${{ steps.source.outputs.mode == 'release' }}
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) target=x86_64-unknown-linux-gnu ;;
          Linux/ARM64) target=aarch64-unknown-linux-gnu ;;
          macOS/X64) target=x86_64-apple-darwin ;;
          macOS/ARM64) target=aarch64-apple-darwin ;;
          Windows/X64) target=x86_64-pc-windows-msvc ;;
          *)
            printf 'Deburr has no prebuilt binary for %s/%s.\n' "$RUNNER_OS" "$RUNNER_ARCH" >&2
            exit 2
            ;;
        esac

        dest="$RUNNER_TEMP/deburr/bin"
        bash "$ACTION_PATH/scripts/install-deburr.sh" \
          "${ACTION_REF#v}" "$target" \
          "https://github.com/$ACTION_REPOSITORY/releases/download/$ACTION_REF" \
          "$dest"

        binary="$dest/deburr"
        if [[ "$RUNNER_OS" == Windows ]]; then
          binary="$binary.exe"
        fi
        printf 'bin=%s\n' "$binary" >> "$GITHUB_OUTPUT"

    - name: Set up Rust
      if: ${{ steps.source.outputs.mode == 'source' }}
      uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      with:
        toolchain: stable
        cache: false
        rustflags: ''

    - name: Build Deburr
      id: build
      if: ${{ steps.source.outputs.mode == 'source' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        # The caller's workspace is untrusted input. Cargo reads
        # .cargo/config.toml from the current directory and every parent, so
        # `build.target`, `build.rustc-wrapper`, and `build.target-dir` in the
        # audited repository could redirect the output or run its code. Build
        # a copy of the Action's source under RUNNER_TEMP (outside the
        # workspace and without any .cargo directory), and clear the
        # environment overrides that do the same. CARGO_HOME is replaced with
        # a fresh directory too, because Cargo reads $CARGO_HOME/config.toml
        # regardless of the working directory and a caller may point it into
        # the workspace.
        export CARGO_HOME="$RUNNER_TEMP/deburr/cargo-home"
        rm -rf "$CARGO_HOME"
        mkdir -p "$CARGO_HOME"
        unset RUSTC RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS \
          CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_RUSTC CARGO_BUILD_RUSTC_WRAPPER \
          CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER CARGO_BUILD_RUSTFLAGS \
          CARGO_BUILD_TARGET CARGO_BUILD_TARGET_DIR CARGO_TARGET_DIR

        source_dir="$RUNNER_TEMP/deburr/source"
        target_dir="$RUNNER_TEMP/deburr/target"
        rm -rf "$source_dir"
        mkdir -p "$source_dir"
        tar -C "$ACTION_PATH" --exclude=.git --exclude=.cargo --exclude=target -cf - . \
          | tar -C "$source_dir" -xf -

        cd "$source_dir"
        cargo build --release --locked --target-dir "$target_dir"

        binary="$target_dir/release/deburr"
        if [[ "$RUNNER_OS" == Windows ]]; then
          binary="$binary.exe"
        fi
        printf 'bin=%s\n' "$binary" >> "$GITHUB_OUTPUT"

    - name: Audit
      id: audit
      shell: bash
      env:
        DEBURR_BIN: ${{ steps.release.outputs.bin || steps.build.outputs.bin }}
        DEBURR_PATH: ${{ inputs.path }}
        DEBURR_FORMAT: ${{ inputs.format }}
        DEBURR_DUPLICATES: ${{ inputs.duplicates }}
        DEBURR_MIN_CLONE_TOKENS: ${{ inputs.min-clone-tokens }}
        DEBURR_MIN_CLONE_LINES: ${{ inputs.min-clone-lines }}
      run: |
        set -euo pipefail

        case "$DEBURR_FORMAT" in
          text|json|html|github) ;;
          *)
            printf 'Unsupported Deburr report format: %s\n' "$DEBURR_FORMAT" >&2
            exit 2
            ;;
        esac

        case "$DEBURR_DUPLICATES" in
          true|false) ;;
          *)
            printf 'The Deburr duplicates input must be true or false.\n' >&2
            exit 2
            ;;
        esac

        for value in "$DEBURR_MIN_CLONE_TOKENS" "$DEBURR_MIN_CLONE_LINES"; do
          if [[ ! "$value" =~ ^[1-9][0-9]*$ ]]; then
            printf 'The Deburr min-clone-tokens and min-clone-lines inputs must be positive integers.\n' >&2
            exit 2
          fi
        done

        if [[ -z "$DEBURR_PATH" || "$DEBURR_PATH" == *$'\n'* || "$DEBURR_PATH" == *$'\r'* ]]; then
          printf 'The Deburr path must be non-empty and must not contain newlines.\n' >&2
          exit 2
        fi

        is_absolute_path() {
          case "$1" in
            /*|[A-Za-z]:[\\/]*|\\\\*) return 0 ;;
            *) return 1 ;;
          esac
        }

        target="$DEBURR_PATH"
        if ! is_absolute_path "$target"; then
          target="$GITHUB_WORKSPACE/$target"
        fi

        invocation_dir="$RUNNER_TEMP/deburr/${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}-${RANDOM}"
        mkdir -p "$invocation_dir"
        output="$invocation_dir/report.$DEBURR_FORMAT"
        audit_args=(audit "$target" --format "$DEBURR_FORMAT" --output "$output")
        if [[ "$DEBURR_DUPLICATES" == true ]]; then
          audit_args+=(--min-clone-tokens "$DEBURR_MIN_CLONE_TOKENS" --min-clone-lines "$DEBURR_MIN_CLONE_LINES")
        else
          audit_args+=(--no-duplicates)
        fi

        set +e
        "$DEBURR_BIN" "${audit_args[@]}"
        status=$?
        set -e

        if [[ -f "$output" ]]; then
          if [[ "$DEBURR_FORMAT" == github ]]; then
            cat "$output"
          fi
          printf 'report=%s\n' "$output" >> "$GITHUB_OUTPUT"
        fi
        exit "$status"
