# Vendored copy of tree-sitter-typescript 0.23.2 with the import-type patch
# described in PATCHES.md. Built only as deburr's path dependency.
[package]
name = "tree-sitter-typescript"
description = "TypeScript and TSX grammars for tree-sitter (deburr patched copy)"
version = "0.23.2"
authors = [
  "Max Brunsfeld <maxbrunsfeld@gmail.com>",
  "Amaan Qureshi <amaanq12@gmail.com>",
]
license = "MIT"
keywords = ["incremental", "parsing", "tree-sitter", "typescript", "tsx"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/tree-sitter/tree-sitter-typescript"
edition = "2021"
autoexamples = false
publish = false

build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.1"

[dev-dependencies]
tree-sitter = "0.27"
