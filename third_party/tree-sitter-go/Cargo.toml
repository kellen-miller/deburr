# Vendored copy of tree-sitter-go 0.25.0 with the Go 1.26/1.27 syntax patch
# described in PATCHES.md. Built only as deburr's path dependency.
[package]
name = "tree-sitter-go"
description = "Go grammar for tree-sitter (deburr patched copy)"
version = "0.25.0"
authors = [
  "Max Brunsfeld <maxbrunsfeld@gmail.com>",
  "Amaan Qureshi <amaanq12@gmail.com>",
]
license = "MIT"
keywords = ["incremental", "parsing", "tree-sitter", "go"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/tree-sitter/tree-sitter-go"
edition = "2021"
autoexamples = false
publish = false

build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27"
